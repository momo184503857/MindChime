[project]
name = "mindchime"
version = "0.1.0"
description = "Local knowledge distillation and independent thought agents"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "httpx[socks]>=0.28,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20", "pypdf>=5,<7", "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1",
  "numpy>=2,<3", "cryptography>=44", "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2", "jieba>=0.42,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "reportlab>=4,<5", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/mindchime", "services/ai_service"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
target-version = "py312"
line-length = 110
